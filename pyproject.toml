[project]
name = "agentic-commerce-trust"
version = "0.1.0"
description = "A policy-bounded commerce control room for the Razorpay hackathon"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langgraph>=1.0,<2",
  "openai>=1.70,<3", "mcp>=1.20,<2", "python-dotenv>=1.0,<2",
  "jsonschema>=4.23,<5", "httpx>=0.28,<1"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
